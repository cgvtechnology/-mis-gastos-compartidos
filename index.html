<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gastos Compartidos</title>
  <style>
    :root {
      --primary: #00a86b;
      --danger: #dc3545;
      --warning: #ffc107;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
    }

    body { font-family: Arial, sans-serif; background-color: var(--bg); margin: 20px; color: #333; }
    .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    
    /* Panel de Presupuesto y Alertas */
    .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
    .stat-box { padding: 15px; border-radius: 6px; background: #e9ecef; text-align: center; }
    .stat-box.danger { background: #f8d7da; color: #721c24; }
    .stat-box.warning { background: #fff3cd; color: #856404; }
    
    .alert-banner { display: none; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; }
    .alert-banner.active-danger { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .alert-banner.active-warning { display: block; background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }

    /* Formulario y Tablas */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.9em; }
    input, select, button { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; padding: 10px; }
    button:hover { opacity: 0.9; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #f8f9fa; }
  </style>
</head>
<body>

  <h1>Gastos Compartidos</h1>

  <div id="alertBanner" class="alert-banner"></div>

  <div class="dashboard">
    <div class="card stat-box">
      <h3>Presupuesto Inicial</h3>
      <div class="form-group">
        <input type="number" id="inputPresupuesto" placeholder="Ingresa fondo inicial" step="0.01" />
        <button onclick="guardarPresupuesto()" style="margin-top: 5px;">Fijar Presupuesto</button>
      </div>
      <p><strong id="txtPresupuesto">$ 0,00</strong></p>
    </div>

    <div class="card stat-box" id="boxDisponible">
      <h3>Fondo Restante</h3>
      <h2 id="txtDisponible">$ 0,00</h2>
    </div>

    <div class="card stat-box warning">
      <h3>Mayor Categ. de Gasto</h3>
      <h2 id="txtMayorGasto">N/A</h2>
      <small id="txtMontoMayorGasto">$ 0,00</small>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Registrar Nuevo Gasto</h3>
      <form id="expenseForm">
        <div class="form-group">
          <label>MONTO ($ COP)</label>
          <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required />
        </div>
        <div class="form-group">
          <label>CATEGORÍA</label>
          <select id="category" required>
            <option value="Transporte">Transporte</option>
            <option value="Alimentación">Alimentación</option>
            <option value="Vivienda">Vivienda</option>
            <option value="Entretenimiento">Entretenimiento</option>
          </select>
        </div>
        <div class="form-group">
          <label>SUBCATEGORÍA</label>
          <input type="text" id="subcategory" placeholder="Ej: Combustible/Gasolina" required />
        </div>
        <div class="form-group">
          <label>DESCRIPCIÓN</label>
          <input type="text" id="description" placeholder="Ej: Gasto quincenal" required />
        </div>
        <div class="form-group">
          <label>PAGADO POR</label>
          <input type="text" id="payer" placeholder="Nombre" required />
        </div>
        <div class="form-group">
          <label>MÉTODO DE PAGO</label>
          <select id="method">
            <option value="Efectivo">Efectivo</option>
            <option value="Tarjeta">Tarjeta</option>
            <option value="Transferencia">Transferencia</option>
          </select>
        </div>
        <button type="submit">Guardar Gasto</button>
      </form>
    </div>

    <div class="card">
      <h3>Historial de Gastos</h3>
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Categoría</th>
            <th>Detalle</th>
            <th>Pagado Por</th>
            <th>Monto</th>
          </tr>
        </thead>
        <tbody id="tablaGastos">
          </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 1. Reemplaza con tus credenciales de Firebase Console
    const firebaseConfig = {
      apiKey: "REPLACE_WITH_YOUR_FIREBASE_API_KEY",
      authDomain: "mis-gastos-caf30.firebaseapp.com",
      projectId: "mis-gastos-caf30",
      storageBucket: "mis-gastos-caf30.firebasestorage.app",
      messagingSenderId: "516822429465",
      appId: "1:516822429465:web:3be39c1f32675d57905f88"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let presupuestoInicial = parseFloat(localStorage.getItem('presupuesto_inicial')) || 0;

    // Formateador Pesos Colombianos con Decimales
    const formatearCOP = (valor) => {
      return new Intl.NumberFormat('es-CO', {
        style: 'currency',
        currency: 'COP',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(valor || 0);
    };

    // Hacer accesible la función del botón presupuesto en el HTML
    window.guardarPresupuesto = () => {
      const val = parseFloat(document.getElementById('inputPresupuesto').value);
      if (!isNaN(val) && val >= 0) {
        presupuestoInicial = val;
        localStorage.setItem('presupuesto_inicial', val);
        document.getElementById('inputPresupuesto').value = '';
        escucharCambios();
      }
    };

    // Escuchador en Tiempo Real
    function escucharCambios() {
      const q = query(collection(db, "expenses"));

      onSnapshot(q, (snapshot) => {
        const gastos = [];
        let totalGastado = 0;
        const categoriasMap = {};

        snapshot.forEach((doc) => {
          const data = doc.data();
          gastos.push({ id: doc.id, ...data });

          const monto = parseFloat(data.amount) || 0;
          totalGastado += monto;

          // Agrupar gastos por categoría
          const cat = data.category || 'Otros';
          categoriasMap[cat] = (categoriasMap[cat] || 0) + monto;
        });

        actualizarUI(gastos, totalGastado, categoriasMap);
      });
    }

    function actualizarUI(gastos, totalGastado, categoriasMap) {
      // 1. Dibujar Tabla
      const tbody = document.getElementById('tablaGastos');
      tbody.innerHTML = '';
      
      gastos.forEach(g => {
        tbody.innerHTML += `
          <tr>
            <td>${g.date || ''}</td>
            <td>${g.category} <br><small>${g.subcategory}</small></td>
            <td>${g.description}</td>
            <td>${g.payer}</td>
            <td><strong>${formatearCOP(g.amount)}</strong></td>
          </tr>
        `;
      });

      // 2. Cálculo Presupuesto y Alertas
      const disponible = presupuestoInicial - totalGastado;
      document.getElementById('txtPresupuesto').innerText = formatearCOP(presupuestoInicial);
      document.getElementById('txtDisponible').innerText = formatearCOP(disponible);

      const boxDisp = document.getElementById('boxDisponible');
      const banner = document.getElementById('alertBanner');

      if (presupuestoInicial > 0) {
        const porcentajeGastado = (totalGastado / presupuestoInicial) * 100;

        if (disponible < 0) {
          boxDisp.className = "card stat-box danger";
          banner.className = "alert-banner active-danger";
          banner.innerText = `¡Alerta! Has superado el presupuesto inicial por ${formatearCOP(Math.abs(disponible))}`;
        } else if (porcentajeGastado >= 80) {
          boxDisp.className = "card stat-box warning";
          banner.className = "alert-banner active-warning";
          banner.innerText = `¡Advertencia! Has consumido el ${porcentajeGastado.toFixed(1)}% de tu presupuesto.`;
        } else {
          boxDisp.className = "card stat-box";
          banner.className = "alert-banner";
        }
      }

      // 3. Obtener Mayor Categ. de Gasto
      let mayorCat = 'N/A';
      let maxMonto = 0;

      for (const [cat, monto] of Object.entries(categoriasMap)) {
        if (monto > maxMonto) {
          maxMonto = monto;
          mayorCat = cat;
        }
      }

      document.getElementById('txtMayorGasto').innerText = mayorCat;
      document.getElementById('txtMontoMayorGasto').innerText = formatearCOP(maxMonto);
    }

    // Guardar nuevo registro
    document.getElementById('expenseForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const hoy = new Date();
      const fechaFormateada = hoy.toISOString().split('T')[0];

      const nuevoGasto = {
        amount: parseFloat(document.getElementById('amount').value),
        category: document.getElementById('category').value,
        subcategory: document.getElementById('subcategory').value,
        description: document.getElementById('description').value,
        payer: document.getElementById('payer').value,
        method: document.getElementById('method').value,
        date: fechaFormateada
      };

      try {
        await addDoc(collection(db, "expenses"), nuevoGasto);
        document.getElementById('expenseForm').reset();
      } catch (err) {
        console.error("Error al guardar en Firestore: ", err);
      }
    });

    // Iniciar escuchador al cargar
    escucharCambios();
  </script>
</body>
</html>
